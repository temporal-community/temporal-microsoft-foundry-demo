[project]
name = "temporal-foundry-demo"
version = "0.1.0"
description = "A Temporal worker for Microsoft Agent Framework agents, hosted in a Microsoft Foundry hosted agent and woken by Temporal's worker controller"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-core==1.24.0",
    "agent-framework-openai==1.17.0",
    "azure-ai-agentserver-core==2.3.0",
    "azure-ai-agentserver-invocations==1.3.0",
    "azure-identity==1.27.0",
    "httpx>=0.28,<1",
    "starlette==1.10.0",
    "temporalio==1.36.0",
    "temporalio-microsoft-agent-framework==0.0.1",
]

[dependency-groups]
dev = ["azure-ai-projects==2.11.0", "pytest==9.2.0", "pytest-asyncio==1.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
